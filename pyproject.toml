[project]
name = "starcraft-diffusion-gemma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pyside6>=6.12.0",
    "scbw",
    "setuptools>=84.2.1",
    "uvicorn>=0.34.0",
]

[tool.uv.sources]
scbw = { path = "../sc-docker", editable = true }

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pyright>=1.1.414",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
